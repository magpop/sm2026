<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Wedding RSVPs</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold:      #c06838;
      --gold-dark: #e8935a;
      --sage:      #4ab5b0;
      --mauve:     #2e7da8;
      --cream:     #f8f5ed;
      --dark:      #f8f5ed;
      --dark2:     #ffffff;
      --dark3:     #ede8d5;
      --white:     #1a3a4a;
      --text-dim:  rgba(26,58,74,0.65);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; background: none; font: inherit; }

    /* ── Login Screen ─────────────────────────── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(ellipse at 30% 40%, rgba(201,169,110,0.1), transparent 60%),
                  radial-gradient(ellipse at 70% 70%, rgba(139,111,124,0.1), transparent 60%),
                  var(--dark);
    }
    .login-card {
      background: var(--dark2);
      border: 1px solid rgba(201,169,110,0.25);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .login-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: var(--gold);
      margin-bottom: 0.25rem;
    }
    .login-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 2.5rem;
    }
    .login-label {
      display: block;
      text-align: left;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    .login-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: rgba(26,58,74,0.06);
      border: 1px solid rgba(201,169,110,0.3);
      border-radius: 8px;
      color: var(--white);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .login-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,169,110,0.2);
    }
    .login-btn {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border-radius: 8px;
      color: var(--white);
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: opacity 0.3s, transform 0.3s;
    }
    .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .login-error {
      margin-top: 1rem;
      color: #f0a0a0;
      font-size: 0.85rem;
    }

    /* ── Dashboard ────────────────────────────── */
    #dashboard { display: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--dark2);
      border-bottom: 1px solid rgba(201,169,110,0.2);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .topbar-brand {
      font-family: 'Great Vibes', cursive;
      font-size: 1.8rem;
      color: var(--gold);
    }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .topbar-date {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
    }
    .btn-logout {
      padding: 0.45rem 1rem;
      border: 1px solid rgba(26,58,74,0.15);
      border-radius: 6px;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      transition: all 0.3s;
    }
    .btn-logout:hover { border-color: rgba(26,58,74,0.4); color: var(--white); }
    .btn-back {
      padding: 0.45rem 1rem;
      border: 1px solid rgba(201,169,110,0.4);
      border-radius: 6px;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      transition: all 0.3s;
    }
    .btn-back:hover { background: rgba(201,169,110,0.15); }

    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3rem;
    }
    .stat-card {
      background: var(--dark2);
      border: 1px solid rgba(201,169,110,0.2);
      border-radius: 12px;
      padding: 1.5rem 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      transition: transform 0.3s;
    }
    .stat-card:hover { transform: translateY(-3px); }
    .stat-card.attending { border-color: rgba(125,154,125,0.4); }
    .stat-card.not-attending { border-color: rgba(139,111,124,0.4); }
    .stat-card.guests { border-color: rgba(201,169,110,0.5); }
    .stat-label {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .stat-num {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--gold);
      line-height: 1;
    }
    .stat-card.attending .stat-num { color: #a8d0a8; }
    .stat-card.not-attending .stat-num { color: #c8a0b8; }

    /* Filters & Search */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 0.65rem 1rem;
      background: rgba(26,58,74,0.06);
      border: 1px solid rgba(26,58,74,0.12);
      border-radius: 8px;
      color: var(--white);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .search-box:focus { border-color: var(--gold); }
    .search-box::placeholder { color: rgba(26,58,74,0.3); }
    .filter-btns { display: flex; gap: 0.5rem; }
    .filter-btn {
      padding: 0.55rem 1.1rem;
      border-radius: 6px;
      border: 1px solid rgba(26,58,74,0.12);
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      transition: all 0.3s;
    }
    .filter-btn.active, .filter-btn:hover { background: rgba(201,169,110,0.2); border-color: var(--gold); color: var(--gold); }
    .btn-refresh {
      padding: 0.55rem 1.1rem;
      border-radius: 6px;
      border: 1px solid rgba(26,58,74,0.12);
      font-size: 0.85rem;
      color: var(--text-dim);
      transition: all 0.3s;
    }
    .btn-refresh:hover { color: var(--white); border-color: rgba(26,58,74,0.3); }

    /* Table */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid rgba(26,58,74,0.08);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    thead tr {
      background: rgba(201,169,110,0.12);
      border-bottom: 1px solid rgba(201,169,110,0.2);
    }
    th {
      padding: 0.85rem 1rem;
      text-align: left;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid rgba(26,58,74,0.05);
      transition: background 0.2s;
    }
    tbody tr:hover { background: rgba(26,58,74,0.03); }
    tbody tr:last-child { border-bottom: none; }
    td {
      padding: 0.85rem 1rem;
      color: rgba(26,58,74,0.85);
      vertical-align: middle;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 50px;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge-yes { background: rgba(125,154,125,0.2); color: #a8d0a8; border: 1px solid rgba(125,154,125,0.4); }
    .badge-no  { background: rgba(139,111,124,0.2); color: #c8a0b8; border: 1px solid rgba(139,111,124,0.4); }
    .btn-delete {
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      border: 1px solid rgba(200,100,100,0.3);
      color: rgba(200,120,120,0.8);
      font-size: 0.75rem;
      transition: all 0.25s;
    }
    .btn-delete:hover { background: rgba(200,80,80,0.2); border-color: rgba(200,80,80,0.5); color: #f08080; }
    .td-note {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-dim);
      font-style: italic;
      font-size: 0.85rem;
    }
    .td-date { color: var(--text-dim); font-size: 0.8rem; white-space: nowrap; }
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-dim);
      font-family: 'Inter', sans-serif;
    }
    .empty-state .empty-icon { font-size: 3rem; display: block; margin-bottom: 1rem; opacity: 0.4; }
    .loading-indicator { text-align: center; padding: 3rem; color: var(--text-dim); }

    /* Export button */
    .btn-export {
      padding: 0.55rem 1.2rem;
      border-radius: 6px;
      border: 1px solid rgba(201,169,110,0.4);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    .btn-export:hover { background: rgba(201,169,110,0.15); }

    @media (max-width: 600px) {
      .topbar { padding: 0.8rem 1rem; }
      .main-content { padding: 1.5rem 1rem 3rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      th:nth-child(1), td:nth-child(1),
      th:nth-child(7), td:nth-child(7) { display: none; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════ -->
<!--  LOGIN SCREEN                                  -->
<!-- ══════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <p class="login-title">Admin</p>
    <p class="login-sub">Wedding RSVP Dashboard</p>
    <form id="login-form">
      <label for="admin-password" class="login-label">Password</label>
      <input type="password" id="admin-password" class="login-input" placeholder="Enter admin password" autocomplete="current-password" required />
      <button type="submit" class="login-btn">Enter Dashboard</button>
      <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
    </form>
  </div>
</div>

<!-- ══════════════════════════════════════════════ -->
<!--  MAIN DASHBOARD                                -->
<!-- ══════════════════════════════════════════════ -->
<div id="dashboard">
  <header class="topbar">
    <div class="topbar-brand">Wedding RSVPs</div>
    <div class="topbar-right">
      <span class="topbar-date" id="current-date"></span>
      <a href="/" class="btn-back" id="back-to-invite">← Invitation</a>
      <button class="btn-logout" id="btn-logout">Logout</button>
    </div>
  </header>

  <main class="main-content">
    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total RSVPs</span>
        <span class="stat-num" id="stat-total">—</span>
      </div>
      <div class="stat-card attending">
        <span class="stat-label">Attending</span>
        <span class="stat-num" id="stat-attending">—</span>
      </div>
      <div class="stat-card not-attending">
        <span class="stat-label">Declining</span>
        <span class="stat-num" id="stat-declining">—</span>
      </div>
      <div class="stat-card guests">
        <span class="stat-label">Total Guests</span>
        <span class="stat-num" id="stat-guests">—</span>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input type="search" id="search-input" class="search-box" placeholder="Search by name or message…" />
      <div class="filter-btns">
        <button class="filter-btn active" data-filter="all" id="filter-all">All</button>
        <button class="filter-btn" data-filter="attending" id="filter-attending">Attending</button>
        <button class="filter-btn" data-filter="declining" id="filter-declining">Declining</button>
      </div>
      <button class="btn-refresh" id="btn-refresh" title="Refresh data">↻ Refresh</button>
      <button class="btn-export" id="btn-export">⬇ Export CSV</button>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table id="rsvp-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Guests</th>
            <th>Message</th>
            <th>Date Submitted</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="rsvp-tbody">
          <tr>
            <td colspan="8">
              <div class="loading-indicator">Loading RSVPs…</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  // ── State ──────────────────────────────────────
  let adminPassword = '';
  let allRsvps      = [];
  let currentFilter = 'all';
  let currentSearch = '';

  // ── Login ──────────────────────────────────────
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pwd = document.getElementById('admin-password').value;
    const err = document.getElementById('login-error');
    err.textContent = '';

    try {
      const res = await fetch('/api/admin/rsvps', {
        headers: { 'x-admin-password': pwd },
      });
      if (res.ok) {
        adminPassword = pwd;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display    = 'block';
        const data = await res.json();
        renderDashboard(data);
      } else {
        err.textContent = 'Incorrect password. Please try again.';
      }
    } catch {
      err.textContent = 'Server connection failed. Make sure the server is running.';
    }
  });

  // ── Logout ─────────────────────────────────────
  document.getElementById('btn-logout').addEventListener('click', () => {
    adminPassword = '';
    allRsvps      = [];
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display    = 'none';
    document.getElementById('admin-password').value       = '';
  });

  // ── Set current date ───────────────────────────
  const opts = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
  document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-CA', opts);

  // ── Fetch & Refresh ────────────────────────────
  async function fetchRsvps() {
    const res  = await fetch('/api/admin/rsvps', {
      headers: { 'x-admin-password': adminPassword },
    });
    const data = await res.json();
    renderDashboard(data);
  }

  document.getElementById('btn-refresh').addEventListener('click', fetchRsvps);

  // ── Render ─────────────────────────────────────
  function renderDashboard(data) {
    allRsvps = data.rsvps || [];
    // Stats
    document.getElementById('stat-total').textContent     = data.summary.total;
    document.getElementById('stat-attending').textContent = data.summary.attending;
    document.getElementById('stat-declining').textContent = data.summary.notAttending;
    document.getElementById('stat-guests').textContent    = data.summary.totalGuests;
    renderTable();
  }

  function renderTable() {
    let filtered = allRsvps;

    if (currentFilter === 'attending')  filtered = filtered.filter(r => r.attending);
    if (currentFilter === 'declining')  filtered = filtered.filter(r => !r.attending);

    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      filtered = filtered.filter(r =>
        r.name.toLowerCase().includes(q) ||
        (r.message || '').toLowerCase().includes(q) ||
        (r.guestNames || '').toLowerCase().includes(q)
      );
    }

    const tbody = document.getElementById('rsvp-tbody');
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><span class="empty-icon">💌</span><p>No RSVPs found.</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map((r, i) => {
      const dt = new Date(r.timestamp).toLocaleDateString('en-CA', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit',
      });
      const badge = r.attending
        ? `<span class="badge badge-yes">✓ Attending</span>`
        : `<span class="badge badge-no">✕ Declining</span>`;
      return `<tr data-id="${r.id}">
        <td style="color:rgba(26,58,74,0.35)">${i + 1}</td>
        <td><strong>${escHtml(r.name)}</strong>${r.updated ? ' <small style="color:rgba(26,58,74,0.3)">(updated)</small>' : ''}</td>
        <td style="white-space:nowrap">${escHtml(r.phone || '—')}</td>
        <td>${badge}</td>
        <td style="text-align:center">${r.attending ? r.guestCount : '—'}</td>
        <td class="td-note" title="${escHtml(r.message || '')}">${escHtml(r.message || '—')}</td>
        <td class="td-date">${dt}</td>
        <td><button class="btn-delete" onclick="deleteRsvp('${r.id}', '${escHtml(r.name)}')">Delete</button></td>
      </tr>`;
    }).join('');
  }

  // ── Delete RSVP ────────────────────────────────
  async function deleteRsvp(id, name) {
    if (!confirm(`Delete RSVP for "${name}"?\nThis cannot be undone.`)) return;
    try {
      const res = await fetch(`/api/admin/rsvp/${id}`, {
        method:  'DELETE',
        headers: { 'x-admin-password': adminPassword },
      });
      if (res.ok) {
        await fetchRsvps();
      } else {
        alert('Failed to delete. Please try again.');
      }
    } catch {
      alert('Server error. Please try again.');
    }
  }

  // ── Filter buttons ─────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTable();
    });
  });

  // ── Search ─────────────────────────────────────
  document.getElementById('search-input').addEventListener('input', (e) => {
    currentSearch = e.target.value.trim();
    renderTable();
  });

  // ── Export CSV ─────────────────────────────────
  document.getElementById('btn-export').addEventListener('click', () => {
    const header = ['Name', 'Phone', 'Status', 'Guests', 'Message', 'Date Submitted'];
    const rows = allRsvps.map(r => [
      `"${r.name.replace(/"/g, '""')}"`,
      `"${(r.phone || '').replace(/"/g, '""')}"`,
      r.attending ? 'Attending' : 'Declining',
      r.attending ? r.guestCount : 0,
      `"${(r.message || '').replace(/"/g, '""')}"`,
      new Date(r.timestamp).toLocaleString('en-CA'),
    ]);
    const csv = [header.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `wedding-rsvps-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  // ── Helper ─────────────────────────────────────
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
